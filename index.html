<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TETRIS</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; image-rendering: pixelated; }

  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Press Start 2P', monospace;
  }

  .cabinet {
    background: #c0c0c0;
    border: 6px solid #808080;
    border-right-color: #404040;
    border-bottom-color: #404040;
    padding: 10px;
    display: inline-flex;
    flex-direction: column;
    gap: 0;
  }

  .top-bar {
    background: #000;
    padding: 8px 12px;
    text-align: center;
    margin-bottom: 6px;
    border: 3px solid;
    border-color: #404040 #fff #fff #404040;
  }

  .top-bar .logo {
    font-size: 18px;
    color: #fff;
    letter-spacing: 4px;
    text-shadow: 3px 3px 0 #ff0000;
  }

  .game-area {
    display: flex;
    gap: 8px;
    align-items: flex-start;
  }

  .board-wrap {
    border: 4px solid;
    border-color: #404040 #fff #fff #404040;
    background: #000;
    position: relative;
  }

  canvas#tetris { display: block; }

  .right-panel {
    width: 148px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .info-box {
    background: #000;
    border: 4px solid;
    border-color: #404040 #fff #fff #404040;
    padding: 8px;
  }

  .info-label {
    font-size: 6px;
    color: #aaa;
    letter-spacing: 1px;
    margin-bottom: 5px;
  }

  .info-value {
    font-size: 11px;
    color: #fff;
    letter-spacing: 1px;
  }

  .info-value.score-val {
    font-size: 12px;
    color: #ffff00;
  }

  .stats-bar {
    background: #000;
    border: 4px solid;
    border-color: #404040 #fff #fff #404040;
    padding: 6px 8px;
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
  }

  .stat-item { text-align: center; }
  .stat-label { font-size: 5px; color: #606060; margin-bottom: 3px; }
  .stat-val   { font-size: 8px;  color: #00ffff; }

  #overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.88);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 10;
  }

  .ov-title {
    font-size: 14px;
    color: #ffff00;
    text-align: center;
    text-shadow: 2px 2px 0 #ff6600;
    line-height: 1.8;
  }

  .ov-sub {
    font-size: 7px;
    color: #aaa;
    text-align: center;
    line-height: 2;
  }

  .nes-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    padding: 10px 16px;
    background: #c0c0c0;
    border: 3px solid;
    border-color: #fff #404040 #404040 #fff;
    color: #000;
    cursor: pointer;
    letter-spacing: 1px;
  }

  .nes-btn:active {
    border-color: #404040 #fff #fff #404040;
    transform: translate(1px,1px);
  }

  .mobile-controls {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    margin-top: 8px;
  }

  .m-row { display: flex; gap: 4px; }

  .m-btn {
    width: 48px; height: 48px;
    background: #808080;
    border: 3px solid;
    border-color: #c0c0c0 #404040 #404040 #c0c0c0;
    font-family: 'Press Start 2P', monospace;
    font-size: 13px;
    color: #000;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .m-btn:active { border-color: #404040 #c0c0c0 #c0c0c0 #404040; }

  @media (max-width: 600px) {
    .mobile-controls { display: flex; }
    .cabinet { padding: 8px; }
    .top-bar .logo { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="cabinet">
  <div class="top-bar">
    <div class="logo">TETRIS</div>
  </div>

  <div class="game-area">
    <div class="board-wrap">
      <canvas id="tetris" width="320" height="640"></canvas>
      <div id="overlay">
        <div class="ov-title" id="overlayTitle">TETRIS</div>
        <div class="ov-sub" id="overlaySub">PRESS START</div>
        <button class="nes-btn" id="startBtn" onclick="startGame()">START</button>
      </div>
    </div>

    <div class="right-panel">
      <div class="info-box">
        <div class="info-label">SCORE</div>
        <div class="info-value score-val" id="scoreDisplay">000000</div>
      </div>
      <div class="info-box">
        <div class="info-label">HI-SCORE</div>
        <div class="info-value score-val" id="hiDisplay">000000</div>
      </div>
      <div class="info-box">
        <div class="info-label">HOLD</div>
        <canvas id="holdCanvas" width="132" height="70"></canvas>
      </div>
      <div class="info-box">
        <div class="info-label">NEXT</div>
        <canvas id="nextCanvas" width="132" height="90"></canvas>
      </div>
      <div class="info-box">
        <div class="info-label">LEVEL</div>
        <div class="info-value" id="levelDisplay">00</div>
      </div>
      <div class="info-box">
        <div class="info-label">LINES</div>
        <div class="info-value" id="linesDisplay">000</div>
      </div>
      <div class="info-box">
        <div class="info-label">SOUND</div>
        <div class="info-value" id="soundDisplay">ON</div>
      </div>
      <div class="info-box" style="font-size:6px;color:#888;line-height:2.4;padding:7px;">
        <div style="color:#888;margin-bottom:4px;font-size:6px;">CONTROLS</div>
        ←→ MOVE<br>↑ ROTATE<br>↓ SOFT DROP<br>SPC DROP<br>TAB HOLD<br>P/ESC PAUSE<br>R RESTART<br>M MUTE
      </div>
    </div>
  </div>

  <div class="stats-bar">
    <div class="stat-item"><div class="stat-label">TETRIS</div><div class="stat-val" id="tetrisCount">0</div></div>
    <div class="stat-item"><div class="stat-label">TRIPLE</div><div class="stat-val" id="tripleCount">0</div></div>
    <div class="stat-item"><div class="stat-label">DOUBLE</div><div class="stat-val" id="doubleCount">0</div></div>
    <div class="stat-item"><div class="stat-label">SINGLE</div><div class="stat-val" id="singleCount">0</div></div>
  </div>

  <div class="mobile-controls">
    <div class="m-row"><div class="m-btn" ontouchstart="rotatePiece()">↑</div></div>
    <div class="m-row">
      <div class="m-btn" ontouchstart="moveLeft()">←</div>
      <div class="m-btn" ontouchstart="softDrop()">↓</div>
      <div class="m-btn" ontouchstart="moveRight()">→</div>
    </div>
    <div class="m-row">
      <div class="m-btn" style="width:104px;font-size:7px;letter-spacing:1px;" ontouchstart="hardDrop()">DROP</div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('tetris');
const ctx = canvas.getContext('2d');
const nextCanvas = document.getElementById('nextCanvas');
const nCtx = nextCanvas.getContext('2d');
const holdCanvas = document.getElementById('holdCanvas');
const hCtx = holdCanvas.getContext('2d');

const COLS = 10, ROWS = 20, CELL = 32;

// NES Tetris classic colors: [face, dark, highlight]
const COLORS = [
  null,
  ['#00aaff','#004488','#88ddff'], // I
  ['#ffdd00','#886600','#ffff88'], // O
  ['#aa00ff','#550088','#dd88ff'], // T
  ['#00cc00','#005500','#88ff88'], // S
  ['#ff2200','#880000','#ff8888'], // Z
  ['#0044ff','#002288','#88aaff'], // J
  ['#ff8800','#884400','#ffcc88'], // L
];

const PIECES = [
  [[1,1,1,1]],
  [[2,2],[2,2]],
  [[0,3,0],[3,3,3]],
  [[0,4,4],[4,4,0]],
  [[5,5,0],[0,5,5]],
  [[6,0,0],[6,6,6]],
  [[0,0,7],[7,7,7]],
];

let board, piece, nextPiece, heldPiece, canHold, score, level, lines, hiScore, gameRunning, paused;
let dropInterval, lastTime, dropCounter, animFrame;
let counts = {1:0,2:0,3:0,4:0};

let audioCtx = null;
let soundMuted = localStorage.getItem('nes_sound_muted') === '1';

function updateSoundUI(){
  const el = document.getElementById('soundDisplay');
  if(el) el.textContent = soundMuted ? 'OFF' : 'ON';
}

function ensureAudio(){
  if(soundMuted) return null;
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if(audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function tone(freq, start, duration, type='square', volume=0.08){
  const ac = ensureAudio();
  if(!ac) return;
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, ac.currentTime + start);
  gain.gain.setValueAtTime(0.0001, ac.currentTime + start);
  gain.gain.exponentialRampToValueAtTime(volume, ac.currentTime + start + 0.01);
  gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + duration);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(ac.currentTime + start);
  osc.stop(ac.currentTime + start + duration + 0.02);
}

function noise(start, duration, volume=0.05){
  const ac = ensureAudio();
  if(!ac) return;
  const bufferSize = Math.max(1, Math.floor(ac.sampleRate * duration));
  const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
  const data = buffer.getChannelData(0);
  for(let i=0;i<bufferSize;i++) data[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource();
  const gain = ac.createGain();
  src.buffer = buffer;
  gain.gain.setValueAtTime(volume, ac.currentTime + start);
  gain.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + duration);
  src.connect(gain);
  gain.connect(ac.destination);
  src.start(ac.currentTime + start);
  src.stop(ac.currentTime + start + duration);
}

function playSound(name){
  if(soundMuted) return;
  switch(name){
    case 'start':
      tone(392,0,0.08,'square',0.07); tone(523,0.08,0.09,'square',0.07); tone(784,0.17,0.12,'square',0.07);
      break;
    case 'move':
      tone(220,0,0.035,'square',0.035);
      break;
    case 'rotate':
      tone(330,0,0.045,'square',0.045); tone(440,0.035,0.04,'square',0.04);
      break;
    case 'softDrop':
      tone(150,0,0.025,'square',0.025);
      break;
    case 'hardDrop':
      tone(90,0,0.055,'sawtooth',0.065); noise(0,0.045,0.025);
      break;
    case 'lock':
      tone(120,0,0.05,'square',0.045);
      break;
    case 'hold':
      tone(500,0,0.05,'square',0.04); tone(300,0.045,0.05,'square',0.04);
      break;
    case 'line':
      tone(523,0,0.06,'square',0.06); tone(659,0.055,0.06,'square',0.06); tone(784,0.11,0.08,'square',0.065);
      break;
    case 'tetris':
      tone(523,0,0.06,'square',0.065); tone(659,0.06,0.06,'square',0.065); tone(784,0.12,0.06,'square',0.065); tone(1046,0.18,0.12,'square',0.075);
      break;
    case 'pause':
      tone(300,0,0.08,'triangle',0.055);
      break;
    case 'resume':
      tone(600,0,0.08,'triangle',0.055);
      break;
    case 'gameOver':
      tone(220,0,0.12,'square',0.06); tone(165,0.12,0.12,'square',0.06); tone(110,0.24,0.18,'square',0.06);
      break;
    case 'mute':
      tone(440,0,0.05,'square',0.04);
      break;
  }
}

function toggleSound(){
  soundMuted = !soundMuted;
  localStorage.setItem('nes_sound_muted', soundMuted ? '1' : '0');
  updateSoundUI();
  if(!soundMuted) playSound('mute');
}

hiScore = parseInt(localStorage.getItem('nes_hi') || '0');
document.getElementById('hiDisplay').textContent = pad(hiScore,6);
updateSoundUI();

function pad(n,l){ return String(Math.floor(n)).padStart(l,'0'); }

function createBoard(){ return Array.from({length:ROWS},()=>Array(COLS).fill(0)); }

function makePiece(type){
  const shape = PIECES[type].map(r=>[...r]);
  return {
    type,
    shape,
    x: Math.floor(COLS/2)-Math.floor(shape[0].length/2),
    y: 0
  };
}

function randomPiece(){
  const idx = Math.floor(Math.random()*PIECES.length);
  return makePiece(idx);
}

function resetPiecePosition(p){
  p.shape = PIECES[p.type].map(r=>[...r]);
  p.x = Math.floor(COLS/2)-Math.floor(p.shape[0].length/2);
  p.y = 0;
}

function rotate(m){
  const N=m.length, M=m[0].length;
  const r=Array.from({length:M},()=>Array(N).fill(0));
  for(let i=0;i<N;i++) for(let j=0;j<M;j++) r[j][N-1-i]=m[i][j];
  return r;
}

function valid(p,shape){
  const s=shape||p.shape;
  for(let r=0;r<s.length;r++) for(let c=0;c<s[r].length;c++) if(s[r][c]){
    const nx=p.x+c, ny=p.y+r;
    if(nx<0||nx>=COLS||ny>=ROWS) return false;
    if(ny>=0&&board[ny][nx]) return false;
  }
  return true;
}

function merge(){
  piece.shape.forEach((row,r)=>row.forEach((v,c)=>{
    if(v&&piece.y+r>=0) board[piece.y+r][piece.x+c]=v;
  }));
}

// ── Line-clear state ──────────────────────────────────────────────
let flashRows = new Set();   // row indices currently lit white
let clearingLines = false;   // true while animation is running

function clearLines(){
  // Collect full row indices
  const fullRows = [];
  for(let r=0; r<ROWS; r++) if(board[r].every(c=>c)) fullRows.push(r);
  if(fullRows.length === 0){
    spawnPiece();
    return false;
  }
  playSound(fullRows.length === 4 ? 'tetris' : 'line');
  clearingLines = true;
  cancelAnimationFrame(animFrame); // halt the game loop during animation
  animateLineClear(fullRows);
  return true;
}

function animateLineClear(rows){
  const FLASHES = 3, HALF_MS = 30;
  let tick = 0;
  function step(){
    flashRows = (tick % 2 === 0) ? new Set(rows) : new Set();
    draw();
    tick++;
    if(tick < FLASHES * 2){
      setTimeout(step, HALF_MS);
    } else {
      flashRows = new Set();
      removeRows(rows);
    }
  }
  step();
}

function removeRows(rows){
  const rowSet = new Set(rows);
  // Keep only rows that were NOT full, then prepend empty rows at the top
  const kept = board.filter((_, r) => !rowSet.has(r));
  const cleared = rows.length;
  board.length = 0;
  for(let i = 0; i < cleared; i++) board.push(Array(COLS).fill(0));
  for(const row of kept) board.push(row);

  counts[cleared] = (counts[cleared] || 0) + 1;
  const pts = [0, 40, 100, 300, 1200];
  score += pts[cleared] * (level + 1);
  lines += cleared;
  level = Math.floor(lines / 10);
  if(score > hiScore){ hiScore = score; localStorage.setItem('nes_hi', hiScore); }
  updateUI();
  clearingLines = false;
  spawnPiece();
  dropCounter = 0;
  lastTime = performance.now();
  animFrame = requestAnimationFrame(loop);
}

function updateUI(){
  document.getElementById('scoreDisplay').textContent=pad(score,6);
  document.getElementById('hiDisplay').textContent=pad(hiScore,6);
  document.getElementById('levelDisplay').textContent=pad(level,2);
  document.getElementById('linesDisplay').textContent=pad(lines,3);
  document.getElementById('singleCount').textContent=counts[1]||0;
  document.getElementById('doubleCount').textContent=counts[2]||0;
  document.getElementById('tripleCount').textContent=counts[3]||0;
  document.getElementById('tetrisCount').textContent=counts[4]||0;
  const speeds=[800,717,633,550,467,383,300,217,133,100,83,83,83,67,67,67,50,50,50,33];
  dropInterval=speeds[Math.min(level,speeds.length-1)];
}

function getGhost(){
  let g={x:piece.x,y:piece.y,shape:piece.shape};
  while(valid({x:g.x,y:g.y+1,shape:g.shape})) g.y++;
  return g;
}

function drawBlock(cx, px, py, ci, sz){
  sz=sz||CELL;
  if(!COLORS[ci]) return;
  const [face,,hi] = COLORS[ci];

  // face
  cx.fillStyle = face;
  cx.fillRect(px, py, sz, sz);

  // top highlight strip
  cx.fillStyle = hi;
  cx.fillRect(px, py, sz, 3);
  cx.fillRect(px, py, 3, sz);

  // bottom-right shadow
  cx.fillStyle = '#00000066';
  cx.fillRect(px, py+sz-2, sz, 2);
  cx.fillRect(px+sz-2, py, 2, sz);

  // inner recessed square
  cx.fillStyle = face;
  cx.fillRect(px+3, py+3, sz-6, sz-6);

  // tiny corner pixel
  cx.fillStyle = hi;
  cx.fillRect(px+4, py+4, 2, 2);
}

function draw(){
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // subtle grid lines
  ctx.strokeStyle='#111';
  ctx.lineWidth=0.5;
  for(let r=0;r<ROWS;r++) for(let c=0;c<COLS;c++) ctx.strokeRect(c*CELL,r*CELL,CELL,CELL);

  // board — flash rows white instead of drawing blocks
  for(let r=0;r<ROWS;r++){
    if(flashRows.has(r)){
      ctx.fillStyle='#ffffff';
      ctx.fillRect(0,r*CELL,canvas.width,CELL);
    } else {
      for(let c=0;c<COLS;c++)
        if(board[r][c]) drawBlock(ctx,c*CELL,r*CELL,board[r][c]);
    }
  }

  // ghost
  if(piece&&gameRunning&&!paused&&!clearingLines){
    const g=getGhost();
    g.shape.forEach((row,r)=>row.forEach((v,c)=>{
      if(v&&g.y+r>piece.y+r){
        ctx.strokeStyle=COLORS[v][0];
        ctx.lineWidth=1;
        ctx.strokeRect((g.x+c)*CELL+1,(g.y+r)*CELL+1,CELL-2,CELL-2);
      }
    }));
  }

  // active piece
  if(piece&&!clearingLines) piece.shape.forEach((row,r)=>row.forEach((v,c)=>{
    if(v) drawBlock(ctx,(piece.x+c)*CELL,(piece.y+r)*CELL,v);
  }));
}

function drawPreview(cx, previewPiece, w, h){
  cx.fillStyle='#000';
  cx.fillRect(0,0,w,h);
  if(!previewPiece) return;
  const s=PIECES[previewPiece.type], sz=18;
  const ox=Math.floor((w-s[0].length*sz)/2);
  const oy=Math.floor((h-s.length*sz)/2);
  s.forEach((row,r)=>row.forEach((v,c)=>{
    if(v) drawBlock(cx,ox+c*sz,oy+r*sz,v,sz);
  }));
}

function drawNext(){
  drawPreview(nCtx, nextPiece, nextCanvas.width, nextCanvas.height);
}

function drawHold(){
  drawPreview(hCtx, heldPiece, holdCanvas.width, holdCanvas.height);
}

function spawnPiece(){
  piece=nextPiece||randomPiece();
  resetPiecePosition(piece);
  nextPiece=randomPiece();
  canHold=true;
  drawNext();
  drawHold();
  if(!valid(piece)) gameOver();
}

function gameOver(){
  playSound('gameOver');
  gameRunning=false;
  cancelAnimationFrame(animFrame);
  document.getElementById('overlayTitle').textContent='GAME OVER';
  document.getElementById('overlaySub').textContent='SCORE  '+pad(score,6);
  document.getElementById('startBtn').textContent='RETRY';
  document.getElementById('startBtn').style.display='inline-block';
  document.getElementById('overlay').style.display='flex';
}

function startGame(){
  cancelAnimationFrame(animFrame);
  board=createBoard();
  score=0;level=0;lines=0;
  counts={1:0,2:0,3:0,4:0};
  dropInterval=800;dropCounter=0;lastTime=0;
  piece=null;nextPiece=null;heldPiece=null;canHold=true;paused=false;
  clearingLines=false;flashRows=new Set();
  document.getElementById('startBtn').style.display='inline-block';
  document.getElementById('overlay').style.display='none';
  updateUI();
  gameRunning=true;
  playSound('start');
  nextPiece=randomPiece();
  spawnPiece();
  animFrame=requestAnimationFrame(loop);
}

function lockPiece(){
  merge();
  piece = null;
  const isClearing = clearLines();
  if(!isClearing) playSound('lock');
  return isClearing;
}

function loop(ts){
  if(!gameRunning || clearingLines) return;
  const dt=ts-lastTime; lastTime=ts;
  if(!paused){
    dropCounter+=dt;
    if(dropCounter>=dropInterval){
      dropCounter=0;
      if(valid({x:piece.x,y:piece.y+1,shape:piece.shape})){
        piece.y++;
      } else {
        // Only merge if not already being handled by softDrop/hardDrop
        if(!clearingLines){
          const isClearing = lockPiece(); // line-clear animation restarts the loop when needed
          if(isClearing) return;
        }
      }
    }
    draw();
  }
  animFrame=requestAnimationFrame(loop);
}

function moveLeft(){
  if(gameRunning&&!paused&&!clearingLines&&piece&&valid({x:piece.x-1,y:piece.y,shape:piece.shape})){
    piece.x--;
    playSound('move');
  }
}
function moveRight(){
  if(gameRunning&&!paused&&!clearingLines&&piece&&valid({x:piece.x+1,y:piece.y,shape:piece.shape})){
    piece.x++;
    playSound('move');
  }
}
function rotatePiece(){
  if(!gameRunning||paused||clearingLines||!piece) return;
  const rot=rotate(piece.shape);
  let off=0;
  if(!valid({x:piece.x,y:piece.y,shape:rot})){
    off=piece.x>COLS/2?-1:1;
    if(!valid({x:piece.x+off,y:piece.y,shape:rot})){off*=2;if(!valid({x:piece.x+off,y:piece.y,shape:rot}))return;}
  }
  piece.shape=rot; piece.x+=off;
  playSound('rotate');
}
function softDrop(){
  if(!gameRunning||paused||clearingLines||!piece) return;
  if(valid({x:piece.x,y:piece.y+1,shape:piece.shape})){
    piece.y++;
    score++;
    dropCounter=0; // reset so the loop doesn't immediately merge too
    updateUI();
    playSound('softDrop');
  } else {
    // Piece is already at the bottom — lock it now
    lockPiece();
  }
}
function hardDrop(){
  if(!gameRunning||paused||clearingLines||!piece) return;
  let distance = 0;
  while(valid({x:piece.x,y:piece.y+1,shape:piece.shape})){piece.y++;score+=2;distance++;}
  updateUI();
  if(distance > 0) playSound('hardDrop');
  lockPiece();
}

function holdCurrentPiece(){
  if(!gameRunning||paused||clearingLines||!piece||!canHold) return;
  const currentType = piece.type;
  if(!heldPiece){
    heldPiece = makePiece(currentType);
    piece = nextPiece || randomPiece();
    resetPiecePosition(piece);
    nextPiece = randomPiece();
  } else {
    const heldType = heldPiece.type;
    heldPiece = makePiece(currentType);
    piece = makePiece(heldType);
  }
  canHold = false;
  dropCounter = 0;
  playSound('hold');
  drawHold();
  drawNext();
  if(!valid(piece)) gameOver();
  draw();
}

function togglePause(){
  if(!gameRunning||clearingLines) return;
  paused = !paused;
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  if(paused){
    playSound('pause');
    document.getElementById('overlayTitle').textContent='PAUSED';
    document.getElementById('overlaySub').textContent='P / ESC TO RESUME';
    startBtn.style.display='none';
    overlay.style.display='flex';
  } else {
    playSound('resume');
    overlay.style.display='none';
    startBtn.style.display='inline-block';
    lastTime = performance.now();
  }
}

function restartGame(){
  startGame();
}

document.addEventListener('keydown',e=>{
  if(e.code==='Enter' && !gameRunning){
    e.preventDefault();
    startGame();
    return;
  }
  if(e.code==='KeyR'){
    e.preventDefault();
    restartGame();
    return;
  }
  if(e.code==='KeyM'){
    e.preventDefault();
    if(!e.repeat) toggleSound();
    return;
  }
  if(!gameRunning) return;

  switch(e.code){
    case 'ArrowLeft':
      e.preventDefault();
      moveLeft();
      break;
    case 'ArrowRight':
      e.preventDefault();
      moveRight();
      break;
    case 'ArrowUp':
      e.preventDefault();
      if(!e.repeat) rotatePiece();
      break;
    case 'ArrowDown':
      e.preventDefault();
      softDrop();
      break;
    case 'Space':
      e.preventDefault();
      if(!e.repeat) hardDrop();
      break;
    case 'Tab':
      e.preventDefault();
      if(!e.repeat) holdCurrentPiece();
      break;
    case 'KeyP':
    case 'Escape':
      e.preventDefault();
      if(!e.repeat) togglePause();
      break;
  }
});

board=createBoard();
drawHold();
draw();
</script>
